apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: <IMAGE_FRONTEND>
        ports:
        - containerPort: 8080
        env:
        - name: VENTAS_HOST
          value: "ventas:8080"
        - name: DESPACHOS_HOST
          value: "despachos:8081"
