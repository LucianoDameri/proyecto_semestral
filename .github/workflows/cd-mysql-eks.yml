name: MySQL - CD EKS

# =========================================================
# Pipeline de la BASE DE DATOS para el cluster EKS (infra/eks).
# No tiene CI propio porque usa la imagen publica mysql:8.0 (no se
# compila nada). Tambien hace de "bootstrap" del cluster: instala
# metrics-server (requerido por el HPA) y crea/refresca los secrets
# que usan los demas pipelines (mysql-secret, ecr-secret).
#
# Se dispara con cualquier push a 'deploy', o manualmente. Es automatico:
# no requiere ningun paso a mano salvo el terraform apply inicial del
# cluster (infra/eks).
# =========================================================

on:
  push:
    branches: [deploy]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: innovatech-eks
  DB_NAME: innovatech

jobs:
  cd:
    name: "CD - Deploy MySQL + Bootstrap (EKS)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Conectar kubectl al cluster EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}
          kubectl get nodes -o wide

      - name: Instalar metrics-server (idempotente, requerido por el HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=90s || true

      - name: Crear/refrescar Secret de MySQL
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic mysql-secret \
            --from-literal=MYSQL_ROOT_PASSWORD="${DB_PASSWORD}" \
            --from-literal=MYSQL_DATABASE="${{ env.DB_NAME }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Crear/refrescar imagePullSecret para ECR
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          kubectl create secret docker-registry ecr-secret \
            --docker-server=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
            --docker-username=AWS \
            --docker-password=${ECR_TOKEN} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar MySQL y HPA
        run: |
          kubectl apply -f infra/k8s/mysql.yml
          kubectl apply -f infra/k8s/hpa-backends.yml

      - name: Forzar rollout y esperar
        run: |
          kubectl rollout restart deployment/mysql
          kubectl rollout status deployment/mysql --timeout=300s

      - name: Verificar
        run: |
          kubectl get pods -l app=mysql -o wide
          kubectl get secrets
          kubectl get hpa
