name: Frontend - CD (Deploy)

# =========================================================
# CD del FRONTEND (React + Nginx)
# =========================================================
# Se dispara automaticamente cuando termina con exito el workflow
# "Frontend - CI (Build & Push)" (ci-frontend.yml) en la rama
# 'deploy', o manualmente via workflow_dispatch.
#
# Recalcula la URL de la imagen ':latest' en ECR (no depende de
# outputs del otro workflow) y la despliega en la EC2 frontend via
# AWS SSM send-command. El contenedor recibe VENTAS_HOST y
# DESPACHOS_HOST apuntando a la IP privada de la EC2 Backend
# (resuelta dinamicamente).
# =========================================================

on:
  workflow_run:
    workflows: ["Frontend - CI (Build & Push)"]
    types: [completed]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  SERVICE_NAME: frontend
  CONTAINER_PORT: 8080
  HOST_PORT: 80
  ECR_REPO_NAME: innovatech-frontend

jobs:
  cd:
    name: "CD - Deploy Frontend"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image vars
        id: vars
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}"
          echo "image_latest=${ECR_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Resolve backend private IP
        id: backend-ip
        run: |
          BACKEND_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_BACKEND_ID }}" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)
          echo "BACKEND_IP=$BACKEND_IP" >> "$GITHUB_OUTPUT"
          echo "Backend privado: $BACKEND_IP"

      - name: Deploy on EC2 (SSM)
        env:
          IMAGE_LATEST: ${{ steps.vars.outputs.image_latest }}
          BACKEND_IP:   ${{ steps.backend-ip.outputs.BACKEND_IP }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -e

          CMD=$(cat <<EOF
          set -eux
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}
          sudo docker pull ${IMAGE_LATEST}
          sudo docker stop ${{ env.SERVICE_NAME }} || true
          sudo docker rm ${{ env.SERVICE_NAME }} || true
          sudo docker run -d \
            --name ${{ env.SERVICE_NAME }} \
            --restart unless-stopped \
            -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
            -e VENTAS_HOST=${BACKEND_IP}:8080 \
            -e DESPACHOS_HOST=${BACKEND_IP}:8081 \
            ${IMAGE_LATEST}
          sudo docker image prune -f
          EOF
          )

          # Construir el JSON de parametros con jq: el shorthand
          # "commands=$CMD" de la AWS CLI falla con strings multilinea.
          PARAMS=$(jq -n --arg cmd "$CMD" '{commands: [$cmd]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_FRONTEND_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ env.SERVICE_NAME }} ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_FRONTEND_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_FRONTEND_ID }}" \
            --query '{Status:Status, StdOut:StandardOutputContent, StdErr:StandardErrorContent}' \
            --output json
