name: Frontend - CD (Deploy)

# =========================================================
# CD del FRONTEND (React + Nginx) → ECS Fargate
# =========================================================
# Se dispara automaticamente cuando termina con exito el workflow
# "Frontend - CI (Build & Push)" (ci-frontend.yml) en la rama
# 'deploy', o manualmente via workflow_dispatch.
#
# Estrategia: force-new-deployment sobre el servicio ECS.
# ECS descarga automaticamente la imagen ':latest' del ECR y
# reemplaza las tareas en ejecucion (rolling update).
# =========================================================

on:
  workflow_run:
    workflows: ["Frontend - CI (Build & Push)"]
    types: [completed]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: innovatech-frontend
  ECS_CLUSTER: innovatech-cluster
  ECS_SERVICE: innovatech-frontend

jobs:
  cd:
    name: "CD - Deploy Frontend (ECS)"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --query 'service.{status:status,desired:desiredCount,running:runningCount}' \
            --output json

      - name: Wait for ECS service to stabilize
        run: |
          echo "Esperando que el servicio ECS estabilice..."
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"
          echo "Servicio estable."

      - name: Verify deployment
        run: |
          aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount}' \
            --output json
