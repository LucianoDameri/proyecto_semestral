name: MySQL - CD (Bootstrap/Deploy)

# =========================================================
# CD manual para verificar estado de MySQL en EC2 DB.
# MySQL se inicia automaticamente via user_data de Terraform
# (ver infra/ec2.tf). Este workflow es solo de verificacion/
# diagnostico manual si se necesita reiniciar el contenedor.
#
# NOTA: Con ECS Fargate los backends se conectan directamente
# a la IP privada de la EC2 database. MySQL sigue corriendo en EC2.
# =========================================================

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Accion a ejecutar"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - restart

env:
  AWS_REGION: us-east-1

jobs:
  mysql-ops:
    name: "MySQL - Operacion manual"
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Check DB instance state
        run: |
          aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_DATABASE_ID }}" \
            --query 'Reservations[0].Instances[0].{State:State.Name,PrivateIP:PrivateIpAddress,Type:InstanceType}' \
            --output json
