name: Despachos - CD (Deploy)

# =========================================================
# CD del microservicio DESPACHOS
# =========================================================
# Se dispara automaticamente cuando termina con exito el workflow
# "Despachos - CI (Build & Push)" (ci-despachos.yml) en la rama
# 'deploy', o manualmente via workflow_dispatch.
#
# Recalcula la URL de la imagen ':latest' en ECR (no depende de
# outputs del otro workflow) y la despliega en la EC2 backend via
# AWS SSM send-command.
# =========================================================

on:
  workflow_run:
    workflows: ["Despachos - CI (Build & Push)"]
    types: [completed]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  SERVICE_NAME: despachos
  CONTAINER_PORT: 8081
  HOST_PORT: 8081
  ECR_REPO_NAME: innovatech-despachos

jobs:
  cd:
    name: "CD - Deploy Despachos"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image vars
        id: vars
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}"
          echo "image_latest=${ECR_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Resolve database private IP
        id: db-ip
        run: |
          DB_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ vars.EC2_DATABASE_ID }}" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)
          echo "DB_IP=$DB_IP" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 (SSM)
        env:
          IMAGE_LATEST: ${{ steps.vars.outputs.image_latest }}
          DB_IP:        ${{ steps.db-ip.outputs.DB_IP }}
          DB_PASSWORD:  ${{ secrets.DB_PASSWORD }}
          DB_NAME:      ${{ vars.DB_NAME }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -e

          CMD=$(cat <<EOF
          set -eux
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}
          sudo docker pull ${IMAGE_LATEST}
          sudo docker stop ${{ env.SERVICE_NAME }} || true
          sudo docker rm ${{ env.SERVICE_NAME }} || true
          sudo docker run -d \
            --name ${{ env.SERVICE_NAME }} \
            --restart unless-stopped \
            -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
            -e DB_ENDPOINT=${DB_IP} \
            -e DB_PORT=3306 \
            -e DB_NAME=${DB_NAME} \
            -e DB_USERNAME=root \
            -e DB_PASSWORD='${DB_PASSWORD}' \
            -e SERVER_PORT=${{ env.CONTAINER_PORT }} \
            ${IMAGE_LATEST}
          sudo docker image prune -f
          EOF
          )

          # Construir el JSON de parametros con jq: el shorthand
          # "commands=$CMD" de la AWS CLI falla con strings multilinea.
          PARAMS=$(jq -n --arg cmd "$CMD" '{commands: [$cmd]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_BACKEND_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ env.SERVICE_NAME }} ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_BACKEND_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_BACKEND_ID }}" \
            --query '{Status:Status, StdOut:StandardOutputContent, StdErr:StandardErrorContent}' \
            --output json
